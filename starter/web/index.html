<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day 06 · Retrieval Demo</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background: #101522; color: #eef2ff; }
    main { max-width: 980px; margin: 0 auto; padding: 42px 20px 64px; }
    .eyebrow { color: #8ea6ff; text-transform: uppercase; letter-spacing: .12em; font-size: 12px; }
    h1 { font-size: clamp(32px, 6vw, 58px); line-height: 1; margin: 12px 0; }
    .sub { color: #aab4ca; max-width: 680px; }
    .panel, .result { background: #192136; border: 1px solid #2b3858; border-radius: 16px; padding: 18px; margin-top: 24px; }
    label { display: block; color: #aab4ca; font-size: 13px; margin: 14px 0 7px; }
    textarea, select, input { box-sizing: border-box; width: 100%; border: 1px solid #3a496e; border-radius: 10px; background: #0e1422; color: #fff; padding: 12px; font: inherit; }
    textarea { min-height: 90px; resize: vertical; }
    .row { display: grid; grid-template-columns: 150px 1fr auto; gap: 12px; align-items: end; }
    button { border: 0; border-radius: 10px; padding: 12px 18px; background: #7690ff; color: #0b1020; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    .hint, #status { color: #8f9bb7; font-size: 13px; }
    .result h3 { margin: 0 0 8px; color: #b9c6ff; }
    .answer { background: #202d4b; border-color: #6d83dd; }
    .split { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 18px; align-items: start; }
    .meta { color: #8f9bb7; font-size: 12px; margin-bottom: 10px; }
    pre { white-space: pre-wrap; margin: 0; line-height: 1.55; }
    .error { color: #ff9d9d; }
    @media (max-width: 800px) { .row, .split { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">Day 06 · Data Ingestion Engineering</div>
  <h1>Python Docs<br>Retrieval Demo</h1>
    <p class="sub">Nhìn rõ hai lớp của RAG: câu trả lời tiếng Việt do OpenRouter sinh ra và evidence top-3 mà pgvector truy xuất.</p>
  <section class="panel">
    <label for="question">Câu hỏi</label>
    <textarea id="question">What are the two distinguishable kinds of errors in Python?</textarea>
    <div class="row">
      <div><label for="strategy">Strategy</label><select id="strategy"><option>A</option><option>B</option><option selected>C</option></select></div>
      <div><label for="filter">Metadata filter (chỉ C, JSON)</label><input id="filter" value='{"section":"tutorial"}'></div>
      <button id="search">Retrieve</button>
    </div>
    <p id="status" class="hint">A: fixed-size · B: paragraph · C: paragraph + metadata filter · Generation: OpenRouter</p>
  </section>
  <div class="split">
    <section id="answer"></section>
    <section id="results"></section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
$("search").onclick = async () => {
  const button = $("search"); const out = $("results"); const answer = $("answer"); button.disabled = true; out.innerHTML = ""; answer.innerHTML = ""; $("status").textContent = "Retrieving evidence, then generating a grounded answer…";
  try {
    const strategy = $("strategy").value; let filters = null;
    if ($("filter").value.trim() && strategy === "C") filters = JSON.parse($("filter").value);
    const response = await fetch("/api/search", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({question:$("question").value, strategy, filters})});
    const data = await response.json(); if (!response.ok) throw new Error(data.error || "Request failed");
    $("status").textContent = `${data.results.length} evidence chunks · strategy ${data.strategy}`;
    const answerText = typeof data.answer === "string" && data.answer.trim() ? data.answer : "Tài liệu hiện có không cung cấp đủ thông tin để trả lời câu hỏi này.";
    answer.innerHTML = `<article class="result answer"><h3>Generated answer · OpenRouter</h3><pre>${escapeHtml(answerText)}</pre></article>`;
    out.innerHTML = data.results.map((item, i) => `<article class="result"><h3>#${i+1} · score ${item.score.toFixed(4)}</h3><div class="meta">${item.document_id} · ${item.page} · ${item.source}</div><pre>${escapeHtml(item.text)}</pre><div class="meta">${escapeHtml(JSON.stringify(item.metadata))}</div></article>`).join("");
  } catch (error) { $("status").innerHTML = `<span class="error">${escapeHtml(error.message)}</span>`; }
  finally { button.disabled = false; }
};
function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c])); }
</script>
</body>
</html>
